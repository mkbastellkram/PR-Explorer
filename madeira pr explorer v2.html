<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PR Explorer">
<meta name="theme-color" content="#0e1117">
<title>Madeira PR Explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root {
  --bg: #0e1117;
  --surface: #161b24;
  --surface2: #1e2533;
  --border: #2a3244;
  --accent: #4ade80;
  --accent2: #22d3ee;
  --warn: #fb923c;
  --danger: #f87171;
  --text: #e8eaf2;
  --muted: #8892a4;
  --header-h: 60px;
  --filter-h: 52px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bot: env(safe-area-inset-bottom, 0px);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{height:100%;-webkit-text-size-adjust:100%}
body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-size:16px}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;-webkit-tap-highlight-color:transparent}
input,textarea{-webkit-appearance:none}

/* ── LAYOUT ── */
#app{display:grid;grid-template-rows:var(--header-h) var(--filter-h) 1fr;height:100vh;height:100dvh;padding-top:var(--safe-top)}
#header{display:flex;align-items:center;gap:12px;padding:0 16px;background:var(--surface);border-bottom:1px solid var(--border);z-index:100}
#header h1{font-family:'DM Serif Display',serif;font-size:1.25rem;color:var(--accent);white-space:nowrap;flex-shrink:0}
#header-right{margin-left:auto;display:flex;align-items:center;gap:8px;flex-shrink:0}
#count-badge{background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:3px 11px;font-size:.8rem;color:var(--muted);white-space:nowrap}

/* ── FILTERBAR ── */
#filterbar{display:flex;align-items:center;gap:6px;padding:0 12px;background:var(--surface2);border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
#filterbar::-webkit-scrollbar{display:none}
.fchip{height:32px;padding:0 13px;border-radius:16px;border:1px solid var(--border);background:transparent;font-size:.8rem;white-space:nowrap;transition:all .15s;color:var(--muted);flex-shrink:0}
.fchip.active{background:var(--accent);border-color:var(--accent);color:#000;font-weight:600}
.fchip:hover:not(.active){border-color:var(--accent);color:var(--text)}
.fsep{width:1px;height:22px;background:var(--border);flex-shrink:0}
#searchbox{height:32px;padding:0 11px;border-radius:16px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:.82rem;font-family:inherit;outline:none;min-width:110px;flex-shrink:0}
#searchbox::placeholder{color:var(--muted)}
#searchbox:focus{border-color:var(--accent2)}

/* ── MAIN ── */
#main{display:grid;grid-template-columns:350px 1fr;height:100%;overflow:hidden}
#list-panel{overflow-y:auto;background:var(--bg);scrollbar-width:thin;scrollbar-color:var(--border) transparent;-webkit-overflow-scrolling:touch}
#list-panel::-webkit-scrollbar{width:4px}
#list-panel::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

/* ── MAP ── */
#map-panel{position:relative;background:#0a0f18}
#map{width:100%;height:100%}
.leaflet-container{background:#0d1420!important;font-family:'DM Sans',sans-serif!important}

/* ── CARDS ── */
.card{padding:14px 16px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .12s;position:relative;-webkit-tap-highlight-color:transparent}
.card:active{background:var(--surface)}
.card.selected{background:var(--surface2);border-left:3px solid var(--accent)}
.card-top{display:flex;align-items:flex-start;gap:10px}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:46px;height:24px;border-radius:5px;font-size:.72rem;font-weight:700;letter-spacing:.03em;flex-shrink:0;padding:0 7px}
.badge.easy{background:rgba(74,222,128,.15);color:#4ade80;border:1px solid rgba(74,222,128,.3)}
.badge.mid{background:rgba(251,146,60,.15);color:#fb923c;border:1px solid rgba(251,146,60,.3)}
.badge.hard{background:rgba(248,113,113,.15);color:#f87171;border:1px solid rgba(248,113,113,.3)}
.badge.unknown{background:rgba(136,146,164,.12);color:var(--muted);border:1px solid var(--border)}
.card-info{flex:1;min-width:0}
.card-name{font-size:.92rem;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
.card-sub{font-size:.78rem;color:var(--muted);margin-top:3px;display:flex;gap:7px;flex-wrap:wrap;line-height:1.4}
.card-meta{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}
.metapill{display:inline-flex;align-items:center;gap:3px;font-size:.72rem;padding:2px 8px;border-radius:10px;background:var(--surface2);border:1px solid var(--border);color:var(--muted)}
.metapill.gpx{border-color:rgba(34,211,238,.3);color:var(--accent2)}
.metapill.fav{border-color:rgba(251,146,60,.3);color:#fb923c}
.metapill.done{border-color:rgba(74,222,128,.3);color:var(--accent)}
.metapill.planned{border-color:rgba(167,139,250,.3);color:#a78bfa;font-size:.7rem}
.card-actions{position:absolute;top:12px;right:12px;display:flex;gap:5px;opacity:0;transition:opacity .15s}
.card:hover .card-actions,.card.selected .card-actions{opacity:1}
.icon-btn{width:30px;height:30px;border-radius:7px;background:var(--surface2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:.85rem;transition:all .12s;flex-shrink:0}
.icon-btn:hover{background:var(--accent);border-color:var(--accent);color:#000}
.icon-btn.active-fav{color:#fb923c;border-color:rgba(251,146,60,.4)}
.icon-btn.active-done{color:var(--accent);border-color:rgba(74,222,128,.4)}
#empty{padding:40px 24px;text-align:center;color:var(--muted);font-size:.9rem}

/* ── DRAWER ── */
#drawer{position:fixed;top:0;right:0;width:min(500px,100vw);height:100vh;height:100dvh;background:var(--surface);border-left:1px solid var(--border);z-index:500;transform:translateX(100%);transition:transform .28s cubic-bezier(.4,0,.2,1);overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--border) transparent;padding-bottom:var(--safe-bot)}
#drawer.open{transform:translateX(0)}
#drawer::-webkit-scrollbar{width:4px}
#drawer::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
#drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:499;display:none}
#drawer-overlay.show{display:block}
#drawer-header{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface);z-index:10}
#drawer-close{width:34px;height:34px;border-radius:8px;background:var(--surface2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:1rem;flex-shrink:0}
#drawer-close:hover,#drawer-close:active{background:var(--danger);border-color:var(--danger);color:#fff}
#drawer-title-wrap{flex:1;min-width:0}
#drawer-num{font-size:.75rem;color:var(--accent);font-weight:700;letter-spacing:.06em;margin-bottom:2px}
#drawer-title{font-family:'DM Serif Display',serif;font-size:1.05rem;line-height:1.3}
#drawer-body{padding:16px}

.dsection{margin-bottom:22px}
.dsection-title{font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.dfact-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dfact{background:var(--surface2);border:1px solid var(--border);border-radius:9px;padding:9px 11px}
.dfact label{font-size:.7rem;color:var(--muted);display:block;margin-bottom:3px}
.dfact value{font-size:.88rem;font-weight:500;display:block}
.dfact value.accent{color:var(--accent)}
.dfact value.accent2{color:var(--accent2)}
.dfact.wide{grid-column:span 2}

.dlink-row{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
.dlink{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border-radius:9px;font-size:.8rem;border:1px solid var(--border);background:var(--surface2);transition:all .15s;white-space:nowrap;cursor:pointer}
.dlink:hover,.dlink:active{background:var(--accent);border-color:var(--accent);color:#000}
.dlink.primary{background:rgba(74,222,128,.12);border-color:rgba(74,222,128,.4);color:var(--accent)}
.dlink.primary:hover,.dlink.primary:active{background:var(--accent);color:#000}

/* planning */
.plan-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.plan-field{display:flex;flex-direction:column;gap:4px}
.plan-field label{font-size:.72rem;color:var(--muted)}
.plan-field input[type=datetime-local]{width:100%;height:36px;padding:0 10px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:.78rem;font-family:inherit;outline:none}
.plan-field input[type=datetime-local]:focus{border-color:var(--accent2)}
.plan-field textarea{width:100%;min-height:72px;padding:9px 10px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:.82rem;font-family:inherit;outline:none;resize:vertical;line-height:1.5}
.plan-field textarea:focus{border-color:var(--accent2)}
.toggle-row{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}
.tog-btn{padding:6px 14px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);font-size:.8rem;transition:all .12s}
.tog-btn:hover,.tog-btn:active{border-color:var(--muted)}
.tog-btn.on-fav{border-color:rgba(251,146,60,.5);background:rgba(251,146,60,.12);color:#fb923c}
.tog-btn.on-done{border-color:rgba(74,222,128,.5);background:rgba(74,222,128,.12);color:var(--accent)}
.tog-btn.on-ign{opacity:.5}
.status-row{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.status-dot{width:24px;height:24px;border-radius:50%;border:2px solid transparent;transition:all .12s;cursor:pointer;flex-shrink:0}
.status-dot.open{background:rgba(74,222,128,.3)}
.status-dot.open.sel{border-color:var(--accent);background:var(--accent)}
.status-dot.limited{background:rgba(251,146,60,.3)}
.status-dot.limited.sel{border-color:var(--warn);background:var(--warn)}
.status-dot.closed{background:rgba(248,113,113,.3)}
.status-dot.closed.sel{border-color:var(--danger);background:var(--danger)}
.status-label{font-size:.78rem;color:var(--muted)}

/* elevation profile */
.profile-box{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-top:10px}
.profile-head{display:flex;justify-content:space-between;font-size:.72rem;color:var(--muted);margin-bottom:7px}
.profile-svg{width:100%;display:block}

/* map overlay */
#map-info-bar{position:absolute;bottom:0;left:0;right:0;background:rgba(14,17,23,.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:9px 14px;font-size:.8rem;color:var(--muted);border-top:1px solid var(--border);z-index:400;display:none}
#map-info-bar.show{display:block}
#map-toolbar{position:absolute;top:10px;left:10px;z-index:400;display:flex;flex-direction:column;gap:6px}
.map-tb-btn{width:36px;height:36px;border-radius:9px;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:.9rem;color:var(--text);transition:all .12s}
.map-tb-btn:hover,.map-tb-btn:active{background:var(--accent);border-color:var(--accent);color:#000}

/* settings */
#settings-modal{position:fixed;inset:0;z-index:600;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.65);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:20px}
#settings-modal.show{display:flex}
#settings-box{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:22px;width:min(380px,100%);max-height:85vh;overflow-y:auto}
#settings-box h2{font-family:'DM Serif Display',serif;font-size:1.15rem;margin-bottom:18px}
.sfield{margin-bottom:14px}
.sfield label{font-size:.75rem;color:var(--muted);display:block;margin-bottom:5px}
.sfield input{width:100%;height:38px;padding:0 11px;border-radius:9px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:.85rem;font-family:inherit;outline:none}
.sfield input:focus{border-color:var(--accent2)}
.sfield .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.s-hint{font-size:.72rem;color:var(--muted);margin-top:4px;line-height:1.4}
.sbtn{width:100%;height:40px;border-radius:9px;background:var(--accent);color:#000;font-weight:600;font-size:.88rem;margin-top:6px;transition:opacity .15s;cursor:pointer}
.sbtn:hover{opacity:.85}
.sbtn.cancel{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
.sbtn-row{display:flex;gap:8px;margin-top:10px}

/* toast */
#toast{position:fixed;bottom:calc(20px + var(--safe-bot));left:50%;transform:translateX(-50%) translateY(12px);background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:9px 18px;font-size:.82rem;opacity:0;transition:all .22s;pointer-events:none;z-index:9999;white-space:nowrap;box-shadow:0 4px 20px rgba(0,0,0,.4)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* mobile */
#map-mobile-btn{display:none;position:fixed;bottom:calc(24px + var(--safe-bot));right:20px;width:52px;height:52px;border-radius:50%;background:var(--accent);color:#000;font-size:1.3rem;z-index:300;box-shadow:0 4px 24px rgba(0,0,0,.5);align-items:center;justify-content:center}
@media(max-width:700px){
  #map-mobile-btn{display:flex}
  #main{grid-template-columns:1fr}
  #map-panel{display:none}
  #map-panel.mobile-show{display:block;position:fixed;inset:0;z-index:200;padding-bottom:var(--safe-bot)}
  .card-actions{opacity:1}
}

/* Leaflet overrides */
.leaflet-popup-content-wrapper{background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:11px;box-shadow:0 4px 24px rgba(0,0,0,.5)}
.leaflet-popup-tip{background:var(--surface)}
.leaflet-popup-content{margin:11px 15px;font-size:.82rem;line-height:1.5}
.popup-title{font-weight:600;margin-bottom:4px;font-size:.9rem}
.popup-sub{font-size:.75rem;color:var(--muted)}
.popup-links{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.popup-links a{font-size:.75rem;padding:4px 10px;border-radius:7px;background:var(--surface2);border:1px solid var(--border)}
.leaflet-control-layers{background:var(--surface)!important;border:1px solid var(--border)!important;border-radius:10px!important;color:var(--text)!important}
.leaflet-control-layers-base label,.leaflet-control-layers-overlays label{color:var(--text)!important;font-size:.82rem!important}
</style>
</head>
<body>
<div id="app">
  <header id="header">
    <h1>🗺 Madeira PR Explorer</h1>
    <div id="header-right">
      <span id="count-badge">37 Touren</span>
      <button class="icon-btn" id="all-map-btn" title="Alle auf Karte">🗺</button>
      <button class="icon-btn" id="settings-btn" title="Einstellungen">⚙</button>
    </div>
  </header>

  <div id="filterbar">
    <input id="searchbox" placeholder="Suchen…" autocomplete="off" spellcheck="false">
    <div class="fsep"></div>
    <button class="fchip active" data-level="all">Alle</button>
    <button class="fchip" data-level="leicht">🟢 Leicht</button>
    <button class="fchip" data-level="mittel">🟡 Mittel</button>
    <button class="fchip" data-level="schwer">🔴 Schwer</button>
    <div class="fsep"></div>
    <button class="fchip active" data-plan="all">Alle</button>
    <button class="fchip" data-plan="fav">♥ Favoriten</button>
    <button class="fchip" data-plan="planned">📅 Geplant</button>
    <button class="fchip" data-plan="done">✓ Erledigt</button>
  </div>

  <div id="main">
    <div id="list-panel">
      <div id="card-list"></div>
      <div id="empty" style="display:none">Keine Treffer.</div>
    </div>
    <div id="map-panel">
      <div id="map"></div>
      <div id="map-toolbar">
        <button class="map-tb-btn" id="fit-btn" title="Alle anzeigen">⊞</button>
      </div>
      <div id="map-info-bar"></div>
    </div>
  </div>
</div>

<div id="drawer-overlay"></div>
<div id="drawer">
  <div id="drawer-header">
    <button id="drawer-close">✕</button>
    <div id="drawer-title-wrap">
      <div id="drawer-num"></div>
      <div id="drawer-title"></div>
    </div>
    <button class="icon-btn" id="d-map-btn" title="Auf Karte">🗺</button>
    <button class="icon-btn" id="d-track-btn" title="GPX-Track anzeigen" style="display:none">📍</button>
  </div>
  <div id="drawer-body"></div>
</div>

<div id="settings-modal">
  <div id="settings-box">
    <h2>⚙ Startbasis</h2>
    <div class="sfield">
      <label>Name der Unterkunft</label>
      <input id="s-name" value="Pestana Promenade" autocomplete="off">
    </div>
    <div class="sfield">
      <div class="row2">
        <div><label>Latitude</label><input id="s-lat" value="32.6389" inputmode="decimal"></div>
        <div><label>Longitude</label><input id="s-lon" value="-16.9379" inputmode="decimal"></div>
      </div>
      <div class="s-hint">Koordinaten aus Google Maps kopieren (Rechtsklick auf Unterkunft)</div>
    </div>
    <div class="sfield">
      <label>Fahrtzeit-Puffer (Faktor)</label>
      <input id="s-factor" value="1.20" inputmode="decimal">
      <div class="s-hint">1.0 = Google Maps Zeit · 1.2 = +20% Puffer empfohlen</div>
    </div>
    <div class="sbtn-row">
      <button class="sbtn cancel" id="s-cancel">Abbrechen</button>
      <button class="sbtn" id="s-save">Speichern</button>
    </div>
  </div>
</div>

<button id="map-mobile-btn" aria-label="Karte öffnen">🗺</button>
<div id="toast"></div>

<script>

let base = loadBase();
let userState = loadUserState();

function loadBase() {
  try {
    const saved = JSON.parse(localStorage.getItem('mpr-base') || 'null');
    return Object.assign({name:'Pestana Promenade',lat:32.6389,lon:-16.9379,factor:1.2}, saved || {});
  } catch(e) {
    return {name:'Pestana Promenade',lat:32.6389,lon:-16.9379,factor:1.2};
  }
}
function saveBase() {
  try { localStorage.setItem('mpr-base', JSON.stringify(base)); } catch(e){}
}
function loadUserState() {
  try { return JSON.parse(localStorage.getItem('mpr-state') || '{}'); } catch(e) { return {}; }
}
function saveUserState() {
  try { localStorage.setItem('mpr-state', JSON.stringify(userState)); } catch(e){}
}
function getState(id) {
  if (!userState[id]) userState[id] = {fav:false,done:false,ignore:false,status:'open',note:'',plannedAt:'',bookingAt:''};
  return userState[id];
}
function setState(id, patch) {
  Object.assign(getState(id), patch);

}

  return Number(v).toLocaleString('de-DE', {maximumFractionDigits: dec});
}
function fmtDur(m) {
  if (m == null || isNaN(Number(m))) return '–';
  m = Math.round(Number(m));
  if (m >= 60) return Math.floor(m/60)+'h '+String(m%60).padStart(2,'0')+'m';
  return m+'m';
}
function fmtDT(v) {
  if (!v) return '';
  try { return new Date(v).toLocaleString('de-DE',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}); }

}

    if (filters.plan === 'fav' && !st.fav) return false;
    if (filters.plan === 'planned' && !st.plannedAt) return false;
    if (filters.plan === 'done' && !st.done) return false;
    return true;
  }).sort(function(a, b) {
    var sa = getState(a.id), sb = getState(b.id);
    var da = sa.plannedAt ? new Date(sa.plannedAt).getTime() : Infinity;
    var db = sb.plannedAt ? new Date(sb.plannedAt).getTime() : Infinity;
    if (da !== db) return da - db;
    return POIS.indexOf(a) - POIS.indexOf(b);
  });
}

function renderCards() {

  empty.style.display = 'none';
  container.innerHTML = list.map(function(p) {
    var st = getState(p.id);
    var t = getTrack(p.id);
    var pills = [];
    if (t) pills.push('<span class="metapill gpx">GPX</span>');
    if (st.fav) pills.push('<span class="metapill fav">♥</span>');
    if (st.done) pills.push('<span class="metapill done">✓ Erledigt</span>');
    if (st.plannedAt) pills.push('<span class="metapill planned">📅 ' + fmtDT(st.plannedAt) + '</span>');
    var sel = selectedId === p.id ? ' selected' : '';
    return '<div class="card' + sel + '" data-id="' + p.id + '">' +
      '<div class="card-top">' +
        '<span class="badge ' + levelClass(p.level) + '">' + esc(p.num.replace(/\s/g,'')) + '</span>' +
        '<div class="card-info">' +
          '<div class="card-name">' + esc(p.name) + '</div>' +
          '<div class="card-sub">' +
            '<span>' + esc(p.region || '–') + '</span>' +
            '<span>' + fmt(p.dist_km) + ' km</span>' +
            '<span>' + fmtDur(p.dur_min) + '</span>' +
            '<span>↑' + fmt(p.ele_m, 0) + ' m</span>' +
            '<span>🚗 ' + fmt(p.drive_km) + ' km</span>' +
          '</div>' +
          (pills.length ? '<div class="card-meta">' + pills.join('') + '</div>' : '') +
        '</div>' +

      '<div class="card-actions">' +
        '<button class="icon-btn ' + (st.fav ? 'active-fav' : '') + '" data-action="fav" data-id="' + p.id + '" title="Favorit">♥</button>' +
        '<button class="icon-btn ' + (st.done ? 'active-done' : '') + '" data-action="done" data-id="' + p.id + '" title="Erledigt">✓</button>' +
        '<button class="icon-btn" data-action="map" data-id="' + p.id + '" title="Karte">🗺</button>' +

// ═══════════════════════════════════════════════════════
//  ELEVATION PROFILE
// ═══════════════════════════════════════════════════════
function profileSvg(t) {
  if (!t || !t.profile || t.profile.length < 2) {
    return '<div style="font-size:.78rem;color:var(--muted);padding:8px 0">Kein Höhenprofil verfügbar</div>';
  }
  var W = 320, H = 72, pad = 8;
  var pts = t.profile;
  var maxX = Math.max.apply(null, pts.map(function(p){ return p[0]; })) || 1;
  var eles = pts.map(function(p){ return p[1]; });
  var minE = Math.min.apply(null, eles), maxE = Math.max.apply(null, eles);
  var rng = Math.max(1, maxE - minE);
  var linePoints = pts.map(function(p) {
    var x = pad + (p[0] / maxX) * (W - pad*2);
    var y = H - pad - ((p[1] - minE) / rng) * (H - pad*2);
    return x.toFixed(1) + ',' + y.toFixed(1);
  });
  var fill = linePoints[0].split(',')[0] + ',' + (H-pad) + ' ' + linePoints.join(' ') + ' ' + linePoints[linePoints.length-1].split(',')[0] + ',' + (H-pad);
  return '<div class="profile-box">' +
    '<div class="profile-head"><span>Höhenprofil</span><span>' + fmt(t.ele_min != null ? t.ele_min : minE, 0) + '–' + fmt(t.ele_max != null ? t.ele_max : maxE, 0) + ' m</span></div>' +
    '<svg class="profile-svg" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none">' +
      '<polygon points="' + fill + '" fill="rgba(74,222,128,.1)" stroke="none"/>' +
      '<polyline points="' + linePoints.join(' ') + '" fill="none" stroke="#4ade80" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>' +
    '</svg>' +
  '</div>';
}

function initMap() {
  if (map) return;
  try {
    map = L.map('map', {zoomControl: false, preferCanvas: true}).setView([32.75, -16.95], 10);
    L.control.zoom({position:'topright'}).addTo(map);

    var topo = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {maxZoom:17, attribution:'© OpenTopoMap'});
    var osm  = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19, attribution:'© OSM'});
    var esri = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {maxZoom:19, attribution:'© Esri'});

    var preferred = 'Topo';
    try { preferred = localStorage.getItem('mpr-maplayer') || 'Topo'; } catch(e){}
    var layerMap = {'OSM':osm,'Topo':topo,'Satellit':esri};
    (layerMap[preferred] || topo).addTo(map);
    L.control.layers(layerMap, {}, {position:'topright', collapsed:true}).addTo(map);
    map.on('baselayerchange', function(e){ try{localStorage.setItem('mpr-maplayer', e.name);}catch(ex){} });

    markerLayer = L.layerGroup().addTo(map);
    trackLayer  = L.layerGroup().addTo(map);

    allMapBounds = [];
    POIS.forEach(function(p) {
      var col = levelClass(p.level)==='easy'?'#4ade80':levelClass(p.level)==='mid'?'#fb923c':levelClass(p.level)==='hard'?'#f87171':'#8892a4';
      var m = L.circleMarker([p.lat, p.lon], {radius:8, color:col, weight:2.5, fillColor:col, fillOpacity:.65})
        .bindPopup(
          '<div class="popup-title">' + esc(p.num) + ' · ' + esc(p.name) + '</div>' +
          '<div class="popup-sub">' + esc(p.region||'') + ' · ' + fmt(p.dist_km) + ' km · ' + fmtDur(p.dur_min) + '</div>' +
          '<div class="popup-links">' +
            '<a href="' + esc(routeUrl(p)) + '" target="_blank" rel="noopener">🚗 Route</a>' +
            (p.start_url ? '<a href="' + esc(p.start_url) + '" target="_blank" rel="noopener">📍 Start</a>' : '') +
          '</div>'
        )
        .addTo(markerLayer);
      m.on('click', function(){ openDrawer(p.id); });
      mapMarkers[p.id] = m;
      allMapBounds.push([p.lat, p.lon]);
    });
  } catch(err) {
    console.error('Map init error:', err);
  }
}

function showOnMap(id) {
  initMap();
  if (!map) return;
  var p = POIS.find(function(x){ return x.id===id; });
  if (!p) return;
  var t = getTrack(id);
  trackLayer.clearLayers();

  if (t && t.coords && t.coords.length > 0) {
    try {
      var line = L.polyline(t.coords, {color:'#4ade80', weight:5, opacity:.88, lineCap:'round', lineJoin:'round'});
      line.addTo(trackLayer);
      var s = t.coords[0], e2 = t.coords[t.coords.length-1];
      L.circleMarker(s, {radius:9,color:'#22d3ee',weight:3,fillColor:'#fff',fillOpacity:1}).bindPopup('Start').addTo(trackLayer);
      var dx=(e2[0]-s[0])*111000, dy=(e2[1]-s[1])*111000*Math.cos(s[0]*Math.PI/180);
      if (Math.sqrt(dx*dx+dy*dy) > 150) {
        L.circleMarker(e2, {radius:9,color:'#f87171',weight:3,fillColor:'#fff',fillOpacity:1}).bindPopup('Ende').addTo(trackLayer);
      }
      map.fitBounds(line.getBounds().pad(.15), {maxZoom:15});
      var infoText = '<b>' + esc(p.num) + ' · ' + esc(p.name) + '</b> · ' + fmt(t.dist_km) + ' km';
      if (t.ele_min != null) infoText += ' · ' + fmt(t.ele_min,0) + '–' + fmt(t.ele_max,0) + ' m';
      $('map-info-bar').innerHTML = infoText;
    } catch(err) { console.error('Track draw error:', err); }
  } else {
    map.setView([p.lat, p.lon], 13);
    $('map-info-bar').innerHTML = '<b>' + esc(p.num) + ' · ' + esc(p.name) + '</b> · Kein GPX-Track';
  }
  $('map-info-bar').classList.add('show');

  // Base marker
  try {
    L.circleMarker([base.lat,base.lon],{radius:10,color:'#a78bfa',weight:3,fillColor:'#fff',fillOpacity:1})
      .bindPopup('🏠 ' + esc(base.name)).addTo(trackLayer);
  } catch(e){}
}

// ═══════════════════════════════════════════════════════
//  ICS
// ═══════════════════════════════════════════════════════
function downloadIcs(id) {
  var p = POIS.find(function(x){ return x.id===id; });
  if (!p) { toast('Tour nicht gefunden'); return; }
  var st = getState(id);
  var raw = st.bookingAt || st.plannedAt;
  if (!raw) { toast('Bitte erst Termin oder Buchungsslot eintragen'); return; }
  var start = new Date(raw);
  if (isNaN(start.getTime())) { toast('Datum ungültig'); return; }
  var dur = Number.isFinite(p.dur_min) ? p.dur_min : 180;
  var end = new Date(start.getTime() + dur * 60000);
  function pad(n){ return String(n).padStart(2,'0'); }
  function icsDate(d){ return d.getUTCFullYear()+pad(d.getUTCMonth()+1)+pad(d.getUTCDate())+'T'+pad(d.getUTCHours())+pad(d.getUTCMinutes())+'00Z'; }
  function iesc(s){ return String(s||'').replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;'); }
  var desc = [p.desc_url?'Info: '+p.desc_url:'','Anfahrt: '+routeUrl(p),st.note?'Notiz: '+st.note:''].filter(Boolean).join('\n');
  var lines = [
    'BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Madeira PR Explorer//DE',
    'BEGIN:VEVENT',
    'UID:mpr-'+id+'-'+Date.now()+'@local',
    'DTSTAMP:'+icsDate(new Date()),
    'DTSTART:'+icsDate(start),
    'DTEND:'+icsDate(end),
    'SUMMARY:'+iesc(p.num+' · '+p.name+' – Madeira'),
    'LOCATION:'+iesc(p.name+', Madeira'),
    'DESCRIPTION:'+iesc(desc),
    'END:VEVENT','END:VCALENDAR'
  ];
  try {
    var blob = new Blob([lines.join('\r\n')], {type:'text/calendar;charset=utf-8'});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = id + '_' + p.name.replace(/[^a-z0-9]+/gi,'_') + '.ics';
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){ try{URL.revokeObjectURL(a.href);}catch(e){}; a.remove(); }, 600);
    toast('ICS-Kalendertermin wird heruntergeladen ✓');
  } catch(err) {
    toast('ICS-Export fehlgeschlagen');
    console.error('ICS error:', err);
  }
}

renderCards();
setTimeout(function() {
  try { initMap(); } catch(e){ console.error('initMap failed:', e); }
