function bind(){['searchInput','regionSelect','levelSelect','driveKmRange','driveMinRange','durationRange','hidePs'].forEach(id=>$(id).addEventListener('input',applyFromUi));$('levelChips').addEventListener('click',e=>{const b=e.target.closest('button[data-level]'); if(!b)return; $('levelSelect').value=b.dataset.level; applyFromUi();});$('resetBtn').addEventListener('click',resetFilters);$('saveBaseBtn').addEventListener('click',()=>{saveBase();renderMap();});$('toggleTracksBtn').addEventListener('click',()=>{showTracks=!showTracks;$('toggleTracksBtn').textContent=showTracks?'Tracks aus':'Tracks ein';renderMap();});$('fitMapBtn').addEventListener('click',()=>fitFiltered(true));window.addEventListener('resize',()=>setTimeout(resizeMap,120));window.addEventListener('orientationchange',()=>setTimeout(resizeMap,450));document.addEventListener('visibilitychange',()=>setTimeout(resizeMap,250));}
function applyFromUi(){state.q=$('searchInput').value.trim().toLowerCase();state.region=$('regionSelect').value;state.level=$('levelSelect').value;state.maxKm=Number($('driveKmRange').value);state.maxMin=Number($('driveMinRange').value);state.maxDur=Number($('durationRange').value);state.hidePs=$('hidePs').checked;updateLabels();filterAll();renderAll();}
function updateLabels(){$('driveKmLabel').textContent=state.maxKm>=100?'alle':state.maxKm+' km';$('driveMinLabel').textContent=state.maxMin>=120?'alle':state.maxMin+' min';$('durationLabel').textContent=state.maxDur>=600?'alle':minsToText(state.maxDur);document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('active',c.dataset.level===state.level));}
function resetFilters(){$('searchInput').value='';$('regionSelect').value='all';$('levelSelect').value='all';$('driveKmRange').value='100';$('driveMinRange').value='120';$('durationRange').value='600';$('hidePs').checked=true;applyFromUi();}
function matches(p){if(state.hidePs && String(p.nummer_display||p.nummer||'').toLowerCase().includes('ps')) return false; if(state.region!=='all' && p.region!==state.region)return false; if(state.level!=='all' && levelKey(p.level)!==state.level)return false; if(state.maxKm<100 && (p.drive_km==null || Number(p.drive_km)>state.maxKm))return false; if(state.maxMin<120 && (p.drive_min==null || Number(p.drive_min)>state.maxMin))return false; if(state.maxDur<600 && (p.duration_min==null || Number(p.duration_min)>state.maxDur))return false; if(state.q){const hay=[p.nummer_display,p.nummer,p.name,p.region,p.level,p.parking,p.desc].join(' ').toLowerCase(); if(!hay.includes(state.q))return false;} return true;}
function filterAll(){filtered=POIS.filter(matches);}
function renderAll(){renderList();renderMap();const n=filtered.length;$('resultCounter').textContent=n;$('mapCount').textContent=n;$('statusLeft').textContent=`${n} von ${POIS.length} Touren/POIs · ${TRACKS.length} GPX-Tracks`;$('statusRight').textContent=n+' Treffer';$('summaryText').textContent=`${n} Treffer · Tracks ${showTracks?'sichtbar':'aus'}`;}
function renderList(){$('results').innerHTML=filtered.map(p=>{const t=trackById.get(p.track_id||p.id);const title=p.official_url?`<a class="ctitle" href="${p.official_url}" target="_blank" rel="noopener">${p.nummer_display||p.nummer} · ${p.name}</a>`:`<div class="ctitle">${p.nummer_display||p.nummer} · ${p.name}</div>`;return `<article class="card"><div class="cardTop"><div class="badge">${(p.nummer_display||p.nummer||'PR').replace(' ','<br>')}</div><div class="ctext">${title}<div class="meta">${p.region||'–'} · ${p.level||'k.A.'} · ${t?'GPX vorhanden':'kein GPX'}</div></div></div><div class="facts"><div class="fact"><span>Anfahrt</span><b>${fmt(p.drive_km,' km')} · ${fmt(p.drive_min,' min')}</b></div><div class="fact"><span>Wanderung</span><b>${fmt(p.distance_km,' km')} · ${p.duration_text||minsToText(p.duration_min)}</b></div><div class="fact"><span>Höhenmeter</span><b>${fmt(p.elevation_m,' m')}</b></div><div class="fact"><span>Start</span><b>${fmt(p.lat)} / ${fmt(p.lon)}</b></div><div class="fact"><span>GPX Track</span><b>${t?fmt(t.distance_km,' km')+' · '+t.shown_points+' Pkt.':'–'}</b></div><div class="fact"><span>GPX Höhe</span><b>${t?fmt(t.ele_min,' m')+' – '+fmt(t.ele_max,' m'):'–'}</b></div></div><div class="cardBtns"><a class="smallbtn blue" href="${routeUrl(p)}" target="_blank" rel="noopener">Route</a><a class="smallbtn" href="${startUrl(p)}" target="_blank" rel="noopener">Startpunkt</a><button class="smallbtn" onclick="focusPoi('${p.id}')">Auf Karte</button></div></article>`;}).join('') || '<div class="card"><b>Keine Treffer.</b><br>Filter zurücksetzen oder Suchbegriff ändern.</div>';}
function initMap(){map=L.map('map',{zoomControl:false,attributionControl:true,preferCanvas:true});L.control.zoom({position:'topright'}).addTo(map);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);markersLayer=L.layerGroup().addTo(map);tracksLayer=L.layerGroup().addTo(map);baseMarker=L.circleMarker([HOTEL_DEFAULT.lat,HOTEL_DEFAULT.lon],{radius:8,color:'#0a84ff',weight:3,fillColor:'#fff',fillOpacity:1}).bindPopup('Startbasis: Pestana Promenade').addTo(map);map.setView([32.75,-16.95],10);setTimeout(()=>{resizeMap();fitFiltered(false);},300);}
function renderMap(){if(!map)return;markersLayer.clearLayers();tracksLayer.clearLayers();const b=base();baseMarker.setLatLng([b.lat,b.lon]).bindPopup('Startbasis: '+b.name);filtered.forEach(p=>{if(Number.isFinite(p.lat)&&Number.isFinite(p.lon)){const marker=L.circleMarker([p.lat,p.lon],{radius:7,color:'#0f8a67',weight:3,fillColor:'#ffffff',fillOpacity:1}).bindPopup(`<b>${p.nummer_display||p.nummer} · ${p.name}</b><br>${p.region||''}<br><a href="${routeUrl(p)}" target="_blank">Route ab Startbasis</a>`); marker.addTo(markersLayer);} const t=trackById.get(p.track_id||p.id); if(showTracks&&t&&t.coords&&t.coords.length){L.polyline(t.coords,{color:'#0f8a67',weight:4,opacity:.78,lineJoin:'round'}).bindPopup(`<b>${p.nummer_display||p.nummer} · ${p.name}</b><br>GPX: ${fmt(t.distance_km,' km')}`).addTo(tracksLayer);}});resizeMap();}
function filteredBounds(){const group=[];filtered.forEach(p=>{if(Number.isFinite(p.lat)&&Number.isFinite(p.lon))group.push([p.lat,p.lon]);const t=trackById.get(p.track_id||p.id); if(showTracks&&t&&t.coords) group.push(...t.coords);});return group;}
function fitFiltered(force){if(!map)return;const pts=filteredBounds();if(pts.length){map.fitBounds(L.latLngBounds(pts),{padding:[28,28],maxZoom:13,animate:!!force});}else{map.setView([32.75,-16.95],10);}setTimeout(resizeMap,150);}
function resizeMap(){if(map){map.invalidateSize(false);}}
window.focusPoi=function(id){const p=POIS.find(x=>x.id===id);if(!p||!map)return; const t=trackById.get(p.track_id||p.id); if(showTracks&&t&&t.coords&&t.coords.length) map.fitBounds(L.latLngBounds(t.coords),{padding:[30,30],maxZoom:14}); else map.setView([p.lat,p.lon],13); setTimeout(resizeMap,120); window.scrollTo({top:0,behavior:'smooth'});};
function boot(){setupFilters();loadBase();bind();initMap();resetFilters();}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js?v=7.3').catch(()=>{}));}
</script>
</body></html>
