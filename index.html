<script>
'use strict';
const DATA=JSON.parse(document.getElementById('appdata').textContent); const POIS=DATA.pois, TRACKS=DATA.tracks, VERSION=DATA.version+' · '+DATA.date;
const STORE='madeira_pr_explorer_state_v10'; const OLD='pr-user-state-v1';
const DEFAULT={base:{name:'Pestana Promenade',lat:32.6389,lon:-16.9379,factor:1.2},items:{},ui:{level:'all',plan:'all',search:''}};
let state=loadState(), selected=null, mode='overview'; let map, layers={}, markerLayer, trackLayer, baseLayers={}, currentLayer='topo';
function loadState(){let s=null;try{s=JSON.parse(localStorage.getItem(STORE)||'null')}catch(e){}; if(!s){s=structuredClone(DEFAULT); try{const old=JSON.parse(localStorage.getItem(OLD)||'null'); if(old&&typeof old==='object'){s.items=old.items||old}}catch(e){}}; s.base={...DEFAULT.base,...(s.base||{})}; s.items=s.items||{}; s.ui={...DEFAULT.ui,...(s.ui||{})}; return s}
function save(){localStorage.setItem(STORE,JSON.stringify(state))}
function item(id){return state.items[id]||(state.items[id]={status:'open',fav:false,done:false,planned:false,ignored:false,rating:0,crowd:0,note:'',plannedAt:'',bookedAt:''})}
function fmtMin(m){if(m==null)return 'k.A.'; m=Math.round(m); return m<60?m+' min':Math.floor(m/60)+':'+String(m%60).padStart(2,'0')+' h'}
function plannedMin(p){return p.drive_min==null?null:Math.round(p.drive_min*(state.base.factor||1))}
function levelClass(l){l=(l||'').toLowerCase(); if(l.includes('leicht'))return'easy'; if(l.includes('mittel'))return'mid'; if(l.includes('schwer'))return'hard'; return'unknown'}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function routeUrl(p){return `https://www.google.com/maps/dir/?api=1&origin=${state.base.lat},${state.base.lon}&destination=${p.lat},${p.lon}&travelmode=driving`}
function socialUrl(type,p){const q=encodeURIComponent(`${p.num} ${p.name} Madeira`); if(type==='ig')return `https://www.google.com/search?q=${q}+Instagram+Reels`; if(type==='yt')return `https://www.youtube.com/results?search_query=${q}`; return `https://www.google.com/search?q=${q}`}
function gpxInfo(p){const t=TRACKS[p.id]; if(!t)return 'kein Track'; const d=t.ele_min!=null&&t.ele_max!=null?` · ${t.ele_min}–${t.ele_max} m · Δ ${t.ele_max-t.ele_min} m`:''; return `${t.dist_km} km · ${t.n_points} Pkt.${d}`}
function profileSvg(t){if(!t||!t.profile||!t.profile.length)return '<div class="hint">Kein Höhenprofil vorhanden.</div>'; const pts=t.profile, min=Math.min(...pts.map(p=>p[1])), max=Math.max(...pts.map(p=>p[1])), w=420,h=95,pad=10; const maxD=pts[pts.length-1][0]||1; const path=pts.map((p,i)=>{let x=pad+(p[0]/maxD)*(w-2*pad), y=h-pad-((p[1]-min)/Math.max(1,max-min))*(h-2*pad); return (i?'L':'M')+x.toFixed(1)+' '+y.toFixed(1)}).join(' '); return `<div class="profile"><div class="hint">Höhenprofil · ${Math.round(min)}–${Math.round(max)} m · Δ ${Math.round(max-min)} m</div><svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><path d="M${pad} ${h-pad} L${w-pad} ${h-pad}" stroke="rgba(255,255,255,.18)"/><path d="${path}" fill="none" stroke="#eafff4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg></div>`}
function applyFilters(){let arr=POIS.filter(p=>!p.id.startsWith('ps_pr')); const q=state.ui.search.toLowerCase().trim(); if(q)arr=arr.filter(p=>(p.num+' '+p.name+' '+p.region).toLowerCase().includes(q)); if(state.ui.level!=='all')arr=arr.filter(p=>(p.level||'k.A.')===state.ui.level); arr=arr.filter(p=>!item(p.id).ignored || state.ui.plan==='ignored'); if(state.ui.plan==='fav')arr=arr.filter(p=>item(p.id).fav); if(state.ui.plan==='planned')arr=arr.filter(p=>item(p.id).planned||item(p.id).plannedAt||item(p.id).bookedAt); if(state.ui.plan==='done')arr=arr.filter(p=>item(p.id).done); if(state.ui.plan==='todo')arr=arr.filter(p=>!item(p.id).done&&!item(p.id).ignored); arr.sort((a,b)=>{const ia=item(a.id),ib=item(b.id); if(ia.plannedAt||ib.plannedAt)return (ia.plannedAt||'9999').localeCompare(ib.plannedAt||'9999'); return a.num.localeCompare(b.num,'de',{numeric:true})}); return arr}
function render(){document.getElementById('version').textContent=VERSION; document.getElementById('search').value=state.ui.search; document.querySelectorAll('[data-level]').forEach(b=>b.classList.toggle('active',b.dataset.level===state.ui.level)); document.querySelectorAll('[data-plan]').forEach(b=>b.classList.toggle('active',b.dataset.plan===state.ui.plan)); const arr=applyFilters(); document.getElementById('count').textContent=`${arr.length} Touren`; document.getElementById('list').innerHTML=arr.map(cardHtml).join('')||'<div class="hint" style="padding:20px">Keine Treffer.</div>'; bindCards(); drawMap(arr)}
function cardHtml(p){const it=item(p.id), t=TRACKS[p.id]; const pc=Math.round(plannedMin(p)||0); return `<div class="card ${selected===p.id?'selected':''}" data-id="${p.id}"><div class="ctop"><div class="num ${levelClass(p.level)}">${esc(p.num.replace(' ',''))}</div><div><div class="title">${esc(p.num)} · ${esc(p.name)} ${p.desc_url?'<a href="'+esc(p.desc_url)+'" target="_blank">↗</a>':''}</div><div class="sub">${esc(p.region)} · ${esc(p.level||'k.A.')} · ${t?'Track vorhanden':'kein Track'}</div><div class="mini"><span class="dot ${it.status==='open'?'green':it.status==='limited'?'yellow':'red'}"></span>${it.fav?'♥ ':''}${it.planned?'📅 ':''}${it.done?'✓ ':''}${it.ignored?'ignoriert':''}</div></div></div><div class="facts"><div class="fact"><label>Anfahrt</label><div>${p.drive_km??'k.A.'} km · ${fmtMin(p.drive_min)}<br><span class="hint">geplant ${fmtMin(pc)}</span></div></div><div class="fact"><label>Wanderung</label><div>${p.dist_km??'k.A.'} km · ${fmtMin(p.dur_min)}</div></div><div class="fact"><label>Höhenmeter</label><div>${p.ele_m??'k.A.'} m</div></div><div class="fact"><label>GPX-Profil</label><div>${esc(gpxInfo(p))}</div></div></div><div class="actions"><button class="abtn" data-act="drawer">Details</button><a class="abtn primary" href="${routeUrl(p)}" target="_blank">Route<small>Google Maps</small></a><a class="abtn" href="${esc(p.start_url||('https://maps.google.com/?q='+p.lat+','+p.lon))}" target="_blank">Startpunkt<small>Google Maps</small></a><button class="abtn" data-act="map">OSM</button><button class="abtn" data-act="track">GPX</button><button class="abtn" data-act="inline">Planung</button></div><div class="details-inline" id="in-${p.id}">${inlineHtml(p)}</div></div>`}
function inlineHtml(p){const it=item(p.id);return `<div class="fieldgrid"><div class="field"><label>Geplant</label><input type="datetime-local" data-field="plannedAt" value="${esc(it.plannedAt)}"></div><div class="field"><label>Bestätigter Slot</label><input type="datetime-local" data-field="bookedAt" value="${esc(it.bookedAt)}"></div><div class="field" style="grid-column:1/-1"><label>Notiz</label><textarea data-field="note" placeholder="Parken, Wetter, Buchung, Shuttle…">${esc(it.note)}</textarea></div></div><div class="actions"><a class="abtn" href="${socialUrl('ig',p)}" target="_blank">Instagram Reels</a><a class="abtn" href="${socialUrl('yt',p)}" target="_blank">YouTube</a><a class="abtn" href="${socialUrl('g',p)}" target="_blank">Google</a><button class="abtn" data-act="ics">Kalenderdatei</button></div>`}
function bindCards(){document.querySelectorAll('.card').forEach(c=>{const id=c.dataset.id; const p=POIS.find(x=>x.id===id); c.querySelectorAll('[data-act]').forEach(b=>b.onclick=(e)=>{e.stopPropagation(); const a=b.dataset.act; if(a==='drawer')openDrawer(p); if(a==='inline')c.querySelector('.details-inline').classList.toggle('open'); if(a==='map')showMap('overview',p); if(a==='track')showMap('track',p); if(a==='ics')downloadIcs(p)}); c.onclick=()=>{selected=id; showMap('overview',p); render()}; c.querySelectorAll('[data-field]').forEach(el=>el.onchange=el.oninput=()=>{item(id)[el.dataset.field]=el.value; save()})})}
function openDrawer(p){const it=item(p.id), t=TRACKS[p.id]; document.getElementById('drawerTitle').textContent=p.num+' · '+p.name; document.getElementById('drawerBody').innerHTML=`<div class="section"><h3>Status und Planung</h3><div class="statusdots"><span>Status</span><button class="sdot open ${it.status==='open'?'sel':''}" data-status="open"></button><button class="sdot limited ${it.status==='limited'?'sel':''}" data-status="limited"></button><button class="sdot closed ${it.status==='closed'?'sel':''}" data-status="closed"></button></div><div class="actions"><button class="abtn ${it.fav?'on':''}" data-toggle="fav">♥ Favorit</button><button class="abtn ${it.planned?'on':''}" data-toggle="planned">📅 Geplant</button><button class="abtn ${it.done?'on':''}" data-toggle="done">✓ Erledigt</button><button class="abtn ${it.ignored?'on':''}" data-toggle="ignored">Ignorieren</button></div>${inlineHtml(p)}</div><div class="section"><h3>Kennwerte</h3><div class="facts"><div class="fact"><label>Anfahrt</label><div>${p.drive_km??'k.A.'} km · ${fmtMin(p.drive_min)} · geplant ${fmtMin(plannedMin(p))}</div></div><div class="fact"><label>Wanderung</label><div>${p.dist_km??'k.A.'} km · ${fmtMin(p.dur_min)}</div></div><div class="fact"><label>Startpunkt</label><div>${p.lat} / ${p.lon}</div></div><div class="fact"><label>Gebühr</label><div>${p.fee||'k.A.'}</div></div></div>${profileSvg(t)}</div><div class="section"><h3>Bewertung</h3><div class="hint">Bewertung erst nach Erledigt aktiv.</div><div class="rating ${it.done?'':'disabled'}">${[1,2,3,4,5].map(n=>`<button data-rate="${n}" class="${it.rating>=n?'on':''}">★</button>`).join('')}</div><div class="crowd ${it.done?'':'disabled'}">${[1,2,3,4,5].map(n=>`<button data-crowd="${n}" class="${it.crowd>=n?'on':''}"></button>`).join('')}</div></div>`; document.getElementById('drawer').classList.add('open'); bindDrawer(p)}
function bindDrawer(p){const id=p.id; const body=document.getElementById('drawerBody'); body.querySelectorAll('[data-status]').forEach(b=>b.onclick=()=>{item(id).status=b.dataset.status; save(); openDrawer(p); render()}); body.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>{const k=b.dataset.toggle; item(id)[k]=!item(id)[k]; save(); openDrawer(p); render()}); body.querySelectorAll('[data-field]').forEach(el=>el.onchange=el.oninput=()=>{item(id)[el.dataset.field]=el.value; save()}); body.querySelectorAll('[data-rate]').forEach(b=>b.onclick=()=>{item(id).rating=+b.dataset.rate; save(); openDrawer(p); render()}); body.querySelectorAll('[data-crowd]').forEach(b=>b.onclick=()=>{item(id).crowd=+b.dataset.crowd; save(); openDrawer(p); render()}); body.querySelector('[data-act="ics"]')?.addEventListener('click',()=>downloadIcs(p))}
function initMap(){if(map)return; baseLayers.osm=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OSM'}); baseLayers.topo=L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',{maxZoom:17,attribution:'© OpenTopoMap · © OSM'}); baseLayers.light=L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{maxZoom:19,attribution:'© CARTO · © OSM'}); map=L.map('map',{layers:[baseLayers.topo],zoomControl:true}).setView([32.75,-16.95],10); L.control.layers({'Topo':baseLayers.topo,'OSM':baseLayers.osm,'Hell':baseLayers.light},null,{position:'topright'}).addTo(map); markerLayer=L.layerGroup().addTo(map); trackLayer=L.layerGroup().addTo(map)}
function drawMap(arr){initMap(); markerLayer.clearLayers(); trackLayer.clearLayers(); if(mode==='coverage')return drawCoverage(); const list=arr||applyFilters(); list.forEach(p=>{const it=item(p.id); const m=L.circleMarker([p.lat,p.lon],{radius:selected===p.id?8:5,color:'#eafff4',weight:2,fillColor:it.done?'#24d08d':it.planned?'#ffc857':'#53d4ff',fillOpacity:.85}).bindPopup(`<b>${esc(p.num)} · ${esc(p.name)}</b><br>${esc(p.region)}<div class="popup-links"><a href="${routeUrl(p)}" target="_blank">Route</a><a href="${esc(p.start_url||'#')}" target="_blank">Start</a></div>`); markerLayer.addLayer(m)}); const base=L.circleMarker([state.base.lat,state.base.lon],{radius:7,color:'#fff',fillColor:'#006cff',fillOpacity:.8}).bindPopup('Startbasis: '+esc(state.base.name)); markerLayer.addLayer(base); if(selected&&TRACKS[selected])addTrack(selected,'#53d4ff'); fitLayers()}
function addTrack(id,color){const t=TRACKS[id]; if(!t)return null; const line=L.polyline(t.coords,{color,weight:5,opacity:.95}).addTo(trackLayer); L.circleMarker(t.start,{radius:6,color:'#24d08d',fillColor:'#24d08d',fillOpacity:1}).addTo(trackLayer); L.circleMarker(t.end,{radius:6,color:'#ff5d5d',fillColor:'#ff5d5d',fillOpacity:1}).addTo(trackLayer); return line}
function fitLayers(){setTimeout(()=>{try{const g=L.featureGroup([...markerLayer.getLayers(),...trackLayer.getLayers()]); if(g.getLayers().length)map.fitBounds(g.getBounds().pad(.15))}catch(e){}; map.invalidateSize()},80)}
function showMap(m,p){mode=m; selected=p?.id||selected; document.getElementById('mapwrap').classList.add('mobile'); initMap(); markerLayer.clearLayers(); trackLayer.clearLayers(); if(mode==='track'&&p){addTrack(p.id,'#53d4ff'); document.getElementById('mapbar').textContent=`${p.num} · GPX-Track · ${gpxInfo(p)}`; fitLayers()} else {drawMap([p].filter(Boolean)); document.getElementById('mapbar').textContent=p?`${p.num} · Übersicht mit Startbasis und Startpunkt`:'Übersicht'} }
function drawCoverage(){initMap(); markerLayer.clearLayers(); trackLayer.clearLayers(); const planned=POIS.filter(p=>{const it=item(p.id); return !p.id.startsWith('ps_pr')&&(it.done||it.planned||it.plannedAt||it.bookedAt)}); planned.forEach(p=>{const it=item(p.id), color=it.done?'#24d08d':'#ffc857'; if(TRACKS[p.id])addTrack(p.id,color); L.polyline([[state.base.lat,state.base.lon],[p.lat,p.lon]],{color:'#53d4ff',weight:2,dashArray:'6,8',opacity:.65}).addTo(trackLayer); L.circleMarker([p.lat,p.lon],{radius:6,color,fillColor:color,fillOpacity:.9}).bindPopup(`${p.num} · ${p.name}`).addTo(markerLayer)}); L.circleMarker([state.base.lat,state.base.lon],{radius:8,color:'#fff',fillColor:'#006cff',fillOpacity:.9}).addTo(markerLayer); document.getElementById('mapbar').textContent=`Abdeckung: ${planned.length} geplant/erledigt · gestrichelt = Luftlinie ab Basis`; fitLayers()}
function downloadIcs(p){const it=item(p.id); const dt=it.bookedAt||it.plannedAt; if(!dt){toast('Kein Termin eingetragen');return} const d=new Date(dt); const pad=n=>String(n).padStart(2,'0'); const f=x=>x.getUTCFullYear()+pad(x.getUTCMonth()+1)+pad(x.getUTCDate())+'T'+pad(x.getUTCHours())+pad(x.getUTCMinutes())+'00Z'; const end=new Date(d.getTime()+2*3600e3); const ics=`BEGIN:VCALENDAR\nVERSION:2.0\nBEGIN:VEVENT\nSUMMARY:${p.num} ${p.name}\nDTSTART:${f(d)}\nDTEND:${f(end)}\nDESCRIPTION:Madeira PR Explorer\nLOCATION:${p.lat},${p.lon}\nEND:VEVENT\nEND:VCALENDAR`; const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([ics],{type:'text/calendar'})); a.download=p.id+'.ics'; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function toast(s){const t=document.getElementById('toast'); t.textContent=s; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1800)}
document.getElementById('search').oninput=e=>{state.ui.search=e.target.value; save(); render()}; document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>{state.ui.level=b.dataset.level; save(); render()}); document.querySelectorAll('[data-plan]').forEach(b=>b.onclick=()=>{state.ui.plan=b.dataset.plan; save(); render()}); document.getElementById('drawerClose').onclick=()=>document.getElementById('drawer').classList.remove('open'); document.getElementById('openMapBtn').onclick=()=>showMap('overview', POIS.find(p=>p.id===selected)); document.getElementById('closeMapBtn').onclick=()=>document.getElementById('mapwrap').classList.remove('mobile'); document.getElementById('fitBtn').onclick=fitLayers; document.getElementById('coverageBtn').onclick=()=>{mode='coverage'; document.getElementById('mapwrap').classList.add('mobile'); drawCoverage()};
document.getElementById('settingsBtn').onclick=()=>{const name=prompt('Startbasis Name',state.base.name); if(name!==null)state.base.name=name; const factor=prompt('Fahrzeitfaktor',state.base.factor); if(factor!==null&&!isNaN(+factor))state.base.factor=+factor; save(); render()};
render();
</script><script>if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{});}</script></body></html>
