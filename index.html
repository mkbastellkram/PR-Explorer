<style>

.sheet{min-height:0;border-radius:32px 32px 28px 28px;background:rgba(255,255,255,.88);backdrop-filter:blur(24px) saturate(1.2);border:1px solid rgba(255,255,255,.85);box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden} .grab{width:68px;height:7px;border-radius:999px;background:#d0d5dd;margin:12px auto 4px;flex:0 0 auto} .sheet-head{display:flex;align-items:flex-start;padding:8px 18px 10px;gap:14px} .sheet-title{flex:1} h2{font-size:28px;margin:0;font-weight:850;letter-spacing:-.035em} .sub{font-size:15px;color:var(--muted);margin-top:3px} .counter{background:var(--green);color:white;border-radius:22px;min-width:68px;text-align:center;font-size:28px;font-weight:900;padding:14px 14px;line-height:1}

<div class="app">

    <div class="brand"><div class="eyebrow">Madeira · private Planung</div><h1>Wanderplaner</h1></div>

  <main class="sheet">

      <div class="chips"><button class="chip active" data-quick="all">Alle</button><button class="chip" data-quick="leicht">Leicht</button><button class="chip" data-quick="mittel">Mittel</button><button class="chip" data-quick="schwer">Schwer</button><label class="toggle"><input type="checkbox" id="noPorto" checked>ohne Porto Santo</label></div>
    </div>
    <section class="list" id="list"></section>
  </main>
</div>

const $ = sel => document.querySelector(sel);
const state = {q:'', region:'', level:'', drive:90, walk:480, noPorto:true};
let map, markers=[], layer;
const els={q:$('#q'),region:$('#region'),level:$('#level'),drive:$('#drive'),walk:$('#walk'),noPorto:$('#noPorto'),list:$('#list'),counter:$('#counter'),badge:$('#badge'),status:$('#status'),driveLabel:$('#driveLabel'),walkLabel:$('#walkLabel')};
function norm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');}
function minToText(min){min=Number(min)||0; const h=Math.floor(min/60), m=min%60; return h?`${h}:${String(m).padStart(2,'0')} h`:`${m} min`;}
function options(){
  [...new Set(POIS.map(p=>p.region).filter(Boolean))].sort().forEach(v=>els.region.insertAdjacentHTML('beforeend',`<option>${v}</option>`));
  [...new Set(POIS.map(p=>p.level).filter(Boolean))].sort().forEach(v=>els.level.insertAdjacentHTML('beforeend',`<option>${v}</option>`));
}
function filtered(){
  const q=norm(state.q);
  return POIS.filter(p=>{
    if(state.noPorto && norm(p.region).includes('porto santo')) return false;
    if(state.region && p.region!==state.region) return false;
    if(state.level && p.level!==state.level) return false;
    if((Number(p.drive_min)||0)>state.drive) return false;
    if((Number(p.duration_min)||0)>state.walk) return false;
    if(q && !norm([p.id,p.name,p.region,p.level,p.parking,p.description_key,p.searchText].join(' ')).includes(q)) return false;
    return true;
  });
}
function renderList(items){
  if(!items.length){ els.list.innerHTML='<div class="empty"><b>Keine Treffer</b>Filter reduzieren oder Suche zurücksetzen.</div>'; return; }
  els.list.innerHTML=items.map(p=>`<article class="card" data-id="${p.id}"><div class="cardtop"><div class="marker">${p.id.replace('PR_','PR')}</div><div class="ctext"><div class="ctitle">${p.name}</div><div class="meta">${p.region||'—'} · ${(p.level||'—').toUpperCase()}</div></div></div><div class="facts"><span class="fact">Anfahrt ${p.drive_min||'—'} min</span><span class="fact">${p.drive_km||'—'} km</span><span class="fact">Wanderzeit ${p.duration_text||minToText(p.duration_min)}</span><span class="fact">${p.distance_km||'—'} km Weg</span><span class="fact">HM ${p.elevation_m||'—'} m</span></div><div class="actions"><a class="action primary" href="${p.google_route_url}" target="_blank" rel="noopener">Route</a><a class="action" href="${p.google_maps_url}" target="_blank" rel="noopener">Google Maps</a></div></article>`).join('');
  els.list.querySelectorAll('.card').forEach(card=>card.addEventListener('click',e=>{if(e.target.tagName==='A')return; focusPoi(card.dataset.id);}));
}
function initMap(){
  if(!window.L) { $('#map').style.display='none'; return; }
  map=L.map('map',{zoomControl:false,attributionControl:true,preferCanvas:true}).setView([32.75,-16.95],10);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OpenStreetMap'}).addTo(map);
  const card=document.querySelector('.map-card');
  const inv=()=>{ if(map) map.invalidateSize(false); };
  if('ResizeObserver' in window) new ResizeObserver(inv).observe(card);
  window.addEventListener('resize',inv,{passive:true});
  window.addEventListener('orientationchange',()=>setTimeout(inv,350),{passive:true});
  [80,250,600,1200,2200].forEach(ms=>setTimeout(inv,ms));
  layer=L.layerGroup().addTo(map);
}
function markerColor(level){return level==='leicht'?'#18a058':level==='schwer'?'#e26d2f':'#08785f';}
function svgIcon(p){const c=markerColor(p.level);return L.divIcon({className:'',html:`<div style="width:34px;height:34px;border-radius:15px;background:${c};color:#fff;display:grid;place-items:center;font-weight:900;box-shadow:0 8px 20px rgba(0,0,0,.25);border:2px solid rgba(255,255,255,.95);font-size:11px">${p.id.replace('PR_','')}</div>`,iconSize:[34,34],iconAnchor:[17,17]})}
function renderMap(items){
  if(!map||!layer)return; layer.clearLayers(); markers=[];
  items.filter(p=>p.lat&&p.lon).forEach(p=>{const m=L.marker([p.lat,p.lon],{icon:svgIcon(p)}).bindPopup(`<b>${p.id.replace('PR_','PR')} · ${p.name}</b><br>${p.region||''} · ${p.level||''}<br>Anfahrt: ${p.drive_min||'—'} min`);m.poiId=p.id;m.addTo(layer);markers.push(m);});
}
function fit(items){ if(!map||!markers.length)return; map.invalidateSize(false); const group=L.featureGroup(markers); map.fitBounds(group.getBounds().pad(.18)); [120,400,900].forEach(ms=>setTimeout(()=>map.invalidateSize(false),ms)); }
function focusPoi(id){const p=POIS.find(x=>x.id===id); if(!p)return; const m=markers.find(x=>x.poiId===id); if(map&&m){map.setView(m.getLatLng(),13,{animate:true});m.openPopup();} document.querySelector('.map-card').scrollIntoView({behavior:'smooth',block:'center'});}
function apply(){ state.q=els.q.value; state.region=els.region.value; state.level=els.level.value; state.drive=Number(els.drive.value); state.walk=Number(els.walk.value); state.noPorto=els.noPorto.checked; els.driveLabel.textContent=state.drive>=90?'alle':state.drive+' min'; els.walkLabel.textContent=state.walk>=480?'alle':minToText(state.walk); const items=filtered(); els.counter.textContent=items.length; els.badge.textContent=items.length; els.status.textContent=`${items.length} von ${POIS.length} Touren/POIs`; renderList(items); renderMap(items); }
function reset(){els.q.value='';els.region.value='';els.level.value='';els.drive.value=90;els.walk.value=480;els.noPorto.checked=true;document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('active',c.dataset.quick==='all'));apply();fit(filtered());}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>t.classList.remove('show'),4200)}
function bind(){['input','change'].forEach(ev=>{els.q.addEventListener(ev,apply);els.region.addEventListener(ev,apply);els.level.addEventListener(ev,apply);els.drive.addEventListener(ev,apply);els.walk.addEventListener(ev,apply);els.noPorto.addEventListener(ev,apply);});$('#resetBtn').addEventListener('click',reset);$('#fitBtn').addEventListener('click',()=>fit(filtered()));document.querySelectorAll('.chip[data-quick]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.chip[data-quick]').forEach(x=>x.classList.remove('active'));b.classList.add('active');els.level.value=b.dataset.quick==='all'?'':b.dataset.quick;apply();}));$('#installHelp').addEventListener('click',()=>toast('Für ein Homescreen-Icon: Diese App über Safari per HTTPS öffnen, Teilen-Symbol antippen und „Zum Home-Bildschirm“ wählen. Aus der Dateien-App geht das nicht zuverlässig.'));}
function boot(){try{options();initMap();bind();apply();setTimeout(()=>fit(filtered()),500);els.status.textContent=`${filtered().length} von ${POIS.length} Touren/POIs`; if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('./sw.js').catch(()=>{});}catch(e){console.error(e);els.status.textContent='Fehler beim Laden';els.list.innerHTML='<div class="empty"><b>App-Fehler</b>'+e.message+'</div>';}}
document.addEventListener('DOMContentLoaded', boot);
</script>
